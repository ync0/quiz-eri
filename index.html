<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz do Eri</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Nunito', sans-serif;
            /* Fundo branco baunilha (Vanilla White) */
            background-color: #FDF5E6;
            min-height: 100vh;
            color: #333;
        }

        .fade-in {
            animation: fadeIn 0.4s ease-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        /* Botões em 3D estilo Kahoot/Duolingo */
        .btn-option {
            transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
            border-bottom-width: 5px;
        }
        .btn-option:hover:not(:disabled) {
            transform: translateY(-2px);
            filter: brightness(1.05);
        }
        .btn-option:active:not(:disabled) {
            transform: translateY(3px);
            border-bottom-width: 2px;
            margin-bottom: 3px;
        }
        
        .correct-answer {
            background-color: #58CC02 !important; 
            color: white !important;
            border-color: #46A302 !important;
            pointer-events: none;
        }
        
        .wrong-answer {
            background-color: #FF4B4B !important; 
            color: white !important;
            border-color: #EA1515 !important;
            pointer-events: none;
        }
        
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }
    </style>
</head>
<body class="flex items-center justify-center p-4 sm:p-8">

    <div id="app-container" class="glass-card w-full max-w-2xl overflow-hidden p-6 md:p-10 relative">
        
        <!-- TELA INICIAL -->
        <div id="start-screen" class="text-center fade-in flex flex-col items-center justify-center py-10">
            <h1 class="text-4xl md:text-5xl font-extrabold text-gray-800 mb-4 tracking-tight">Quiz do Eri</h1>
            <p class="text-xl text-gray-600 mb-8 font-bold">Prove que voce e o Eri!</p>
            <button onclick="startQuiz()" class="bg-blue-500 hover:bg-blue-400 text-white font-extrabold py-4 px-12 rounded-2xl text-xl transition-all border-b-4 border-blue-700 active:border-b-0 active:translate-y-1">
                JOGAR AGORA
            </button>
        </div>

        <!-- TELA DO QUIZ -->
        <div id="quiz-screen" class="hidden flex-col h-full fade-in">
            <!-- Barra de progresso -->
            <div class="flex justify-between items-center mb-8">
                <div class="w-full bg-gray-200 rounded-full h-4 mr-4">
                    <div id="progress-bar" class="bg-blue-500 h-4 rounded-full transition-all duration-300" style="width: 0%"></div>
                </div>
                <div class="font-bold text-gray-500 whitespace-nowrap text-lg">
                    <span id="question-number">1</span>/10
                </div>
            </div>
            
            <h3 id="question-text" class="text-2xl md:text-3xl font-extrabold text-gray-800 mb-8 leading-snug text-center">
                <!-- Pergunta injetada aqui -->
            </h3>

            <!-- Opções -->
            <div id="options-container" class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-4">
                <!-- Botões injetados aqui -->
            </div>
        </div>

        <!-- TELA DE RESULTADOS -->
        <div id="result-screen" class="hidden text-center fade-in py-8">
            <div id="result-icon" class="text-6xl mb-4">🎉</div>
            <h2 class="text-3xl font-extrabold text-gray-800 mb-2">Fim de Jogo!</h2>
            <p id="result-message" class="text-xl text-gray-600 mb-8">Você acertou <span id="final-score" class="font-bold text-blue-600 text-2xl"></span> de 10 perguntas!</p>
            
            <button onclick="restartQuiz()" class="bg-green-500 hover:bg-green-400 text-white font-extrabold py-4 px-10 rounded-2xl text-xl transition-all border-b-4 border-green-700 active:border-b-0 active:translate-y-1">
                JOGAR NOVAMENTE
            </button>
        </div>

    </div>

    <script>
        const questions = [
            {
                question: "Quantos anos o Eri tem? (atualmente)",
                options: ["22 anos", "67 anos", "21 anos", "42 anos"],
                answer: "21 anos"
            },
            {
                question: "O Eri tem uma cachorra com nome de...",
                options: ["Branca", "Branca 2", "Branca verdadeira", "perigosa princesa BRANCA explosiva nuclear"],
                answer: "Branca"
            },
            {
                question: "Qual foi a frase modificada da bio do canal do Eri?",
                options: ["literalmente um pinto", "um ovo", "literalmente um ovo", "um pinto"],
                answer: "literalmente um ovo"
            },
            {
                question: "Se o canal nao existisse, qual caminho o Eri seguiria?",
                options: ["Dublador", "Cantor", "Psicologo", "Musico"],
                answer: "Dublador"
            },
            {
                // MÚLTIPLAS RESPOSTAS CORRETAS
                question: "Quais foram as cores de cabelo que o Eri teve?",
                options: ["Amarelo, Branco e Azul", "Azul e Amarelo", "Branco e Azul", "Amarelo, Branco"],
                answer: ["Amarelo, Branco e Azul", "Azul e Amarelo"] 
            },
            {
                question: "Alem do FIGS, qual outro editor aparece nos creditos do video \"VOCE CONHECE O ERI VERDADEIRO?\"?",
                options: ["Abby", "Igor", "Bacon", "Ync"],
                answer: "Igor"
            },
            {
                question: "Onde que o Eri conheceu o seu amigo mais lindo de todos Jao?",
                options: ["em um aniversario em 2021", "em um aniversario em 2022", "na escola", "na escola de canto"],
                answer: "em um aniversario em 2022"
            },
            {
                question: "No titulo de brincadeira \"MEU NOME E ERI ___\", qual palavra que completa a frase?",
                options: ["casca", "ovo", "gema", "pinto"],
                answer: "pinto"
            },
            {
                question: "Em uma das viagens com os amigos, compramos uma meia de qual youtuber?",
                options: ["Enaldinho", "Viniccius13", "Torajo", "Kaduko"],
                answer: "Enaldinho"
            },
            {
                question: "Verdade que o ERI foi vestido de empregada pra BGS?",
                options: ["verdade", "mentira"],
                answer: "verdade"
            }
        ];

        let currentQuestionIndex = 0;
        let score = 0;
        let hasAnswered = false;

        // Referências DOM
        const startScreen = document.getElementById('start-screen');
        const quizScreen = document.getElementById('quiz-screen');
        const resultScreen = document.getElementById('result-screen');
        const questionText = document.getElementById('question-text');
        const optionsContainer = document.getElementById('options-container');
        const questionNumber = document.getElementById('question-number');
        const progressBar = document.getElementById('progress-bar');
        const finalScore = document.getElementById('final-score');

        function startQuiz() {
            startScreen.classList.add('hidden');
            quizScreen.classList.remove('hidden');
            quizScreen.classList.add('flex');
            currentQuestionIndex = 0;
            score = 0;
            loadQuestion();
        }

        function loadQuestion() {
            hasAnswered = false;
            optionsContainer.innerHTML = '';
            
            const currentQuestion = questions[currentQuestionIndex];
            
            questionNumber.innerText = currentQuestionIndex + 1;
            questionText.innerText = currentQuestion.question;
            
            const progress = ((currentQuestionIndex) / questions.length) * 100;
            progressBar.style.width = `${progress}%`;

            currentQuestion.options.forEach(option => {
                const button = document.createElement('button');
                button.innerText = option;
                button.className = 'btn-option w-full text-center p-4 rounded-2xl border-2 border-gray-200 text-gray-700 font-bold bg-white text-lg sm:text-xl shadow-sm';
                button.onclick = (e) => selectAnswer(e, option, currentQuestion.answer);
                optionsContainer.appendChild(button);
            });
        }

        function selectAnswer(event, selectedOption, correctAnswer) {
            if (hasAnswered) return;
            hasAnswered = true;

            const selectedButton = event.target;
            const allButtons = optionsContainer.querySelectorAll('button');
            
            let isCorrect = false;

            if (Array.isArray(correctAnswer)) {
                isCorrect = correctAnswer.includes(selectedOption);
            } else {
                isCorrect = selectedOption === correctAnswer;
            }

            if (isCorrect) {
                selectedButton.classList.add('correct-answer');
                score++;
            } else {
                selectedButton.classList.add('wrong-answer');
                
                allButtons.forEach(btn => {
                    if (Array.isArray(correctAnswer)) {
                        if (correctAnswer.includes(btn.innerText)) {
                            btn.classList.add('correct-answer');
                            btn.style.opacity = '0.7'; 
                        }
                    } else {
                        if (btn.innerText === correctAnswer) {
                            btn.classList.add('correct-answer');
                            btn.style.opacity = '0.7';
                        }
                    }
                });
            }

            allButtons.forEach(btn => btn.disabled = true);
            
            // Avança após 2 segundos
            setTimeout(() => {
                nextQuestion();
            }, 2000);
        }

        function nextQuestion() {
            currentQuestionIndex++;
            
            if (currentQuestionIndex < questions.length) {
                quizScreen.classList.remove('fade-in');
                void quizScreen.offsetWidth; 
                quizScreen.classList.add('fade-in');
                loadQuestion();
            } else {
                showResults();
            }
        }

        function showResults() {
            quizScreen.classList.add('hidden');
            quizScreen.classList.remove('flex');
            resultScreen.classList.remove('hidden');
            
            progressBar.style.width = '100%';
            finalScore.innerText = score;
            
            const resultMessage = document.getElementById('result-message');
            const resultIcon = document.getElementById('result-icon');

            if (score === 10) {
                resultIcon.innerText = "🏆";
                resultMessage.innerHTML = `Você acertou <span class="font-bold text-blue-600 text-2xl">${score}</span> de 10 perguntas!<br><br><strong>Incrível!</strong> Você é oficialmente o maior especialista sobre o Eri.`;
            } else if (score >= 7) {
                 resultIcon.innerText = "😎";
                 resultMessage.innerHTML = `Você acertou <span class="font-bold text-blue-600 text-2xl">${score}</span> de 10 perguntas!<br><br><strong>Mandou muito bem!</strong> Você sabe bastante coisa.`;
            } else {
                 resultIcon.innerText = "😅";
                 resultMessage.innerHTML = `Você acertou <span class="font-bold text-blue-600 text-2xl">${score}</span> de 10 perguntas!<br><br>Talvez seja a hora de maratonar os vídeos novamente!`;
            }
        }

        function restartQuiz() {
            resultScreen.classList.add('hidden');
            startScreen.classList.remove('hidden');
        }
    </script>
</body>
</html>
